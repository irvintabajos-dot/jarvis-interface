<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a12"><title>J.A.R.V.I.S.</title>
<style>
:root{--cyan:#48dfff;--blue:#168bff;--muted:#7893a8;--bg:#050a12}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 42%,#0b1c2b 0%,#050a12 48%,#02050a 100%);color:#e8f7ff;font-family:Inter,Roboto,Arial,sans-serif;min-height:100svh;overflow:hidden;letter-spacing:.08em}.app{min-height:100svh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 22px env(safe-area-inset-bottom);max-width:650px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 2px 12px;border-bottom:1px solid #173448}.brand{font-size:13px;font-weight:700;letter-spacing:.34em}.brand span{color:var(--cyan)}.clock{text-align:right;font-size:12px;color:var(--muted);letter-spacing:.12em}.clock strong{display:block;color:#dff7ff;font-size:17px;font-weight:500;margin-bottom:3px}.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.35em;margin-bottom:22px}.reactor-wrap{width:min(72vw,310px);aspect-ratio:1;position:relative;display:grid;place-items:center;margin:0 auto 27px}.ring{position:absolute;border:1px solid rgba(72,223,255,.35);border-radius:50%;inset:0;box-shadow:0 0 24px #168bff12,inset 0 0 24px #168bff0c}.r2{inset:8%;border-style:dashed;animation:spin 28s linear infinite}.r3{inset:18%;border-color:rgba(72,223,255,.22);border-width:2px;animation:spin 18s linear infinite reverse}.r4{inset:27%;border-color:rgba(72,223,255,.48);box-shadow:0 0 35px #168bff25,inset 0 0 30px #168bff18}.ticks{position:absolute;inset:3%;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(72,223,255,.7) 0deg 1deg,transparent 1deg 15deg);mask:radial-gradient(circle,transparent 68%,#000 69%,#000 70%,transparent 71%);opacity:.6}.core{width:36%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 45%,#b7f7ff 0%,#4bdfff 9%,#0876b9 35%,#06233c 68%,#020a13 100%);box-shadow:0 0 18px #48dfff,0 0 55px #168bff75,inset 0 0 18px #d9fbff66;position:relative}.core:after{content:"";position:absolute;inset:22%;border:1px solid #c5f7ff;border-radius:50%;opacity:.7}.orbit{position:absolute;width:9px;height:9px;background:#a8f5ff;border-radius:50%;top:8%;left:50%;box-shadow:0 0 13px 4px #48dfff;transform-origin:0 130px;animation:orbit 8s linear infinite}.status{font-size:12px;color:var(--cyan);letter-spacing:.32em;text-align:center;min-height:18px}.substatus{font-size:10px;color:var(--muted);letter-spacing:.16em;margin-top:10px;text-align:center}.visualizer{height:34px;display:flex;align-items:center;justify-content:center;gap:4px;margin:17px 0 8px}.visualizer i{display:block;width:2px;height:5px;background:#48dfff;border-radius:3px;opacity:.55}.active .visualizer i{animation:wave .75s ease-in-out infinite alternate}.visualizer i:nth-child(3n){animation-delay:.2s}.visualizer i:nth-child(4n){animation-delay:.4s}.controls{display:flex;align-items:center;justify-content:center;gap:22px;margin:18px 0 24px}.mic{width:76px;height:76px;border-radius:50%;border:1px solid #48dfff99;background:linear-gradient(145deg,#102c40,#07121e);color:#c9f7ff;box-shadow:0 0 25px #168bff35,inset 0 0 18px #48dfff12;display:grid;place-items:center;cursor:pointer}.mic:active{transform:scale(.96)}.mic svg{width:27px;height:27px}.smallbtn{border:1px solid #24465d;background:#08121d;color:#9db9ca;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;cursor:pointer}.smallbtn svg{width:18px;height:18px}.hint{font-size:9px;color:#617e92;letter-spacing:.16em;text-align:center;line-height:1.7;margin-bottom:18px}.footer{border-top:1px solid #173448;display:flex;justify-content:space-between;padding:14px 2px 18px;color:#68879b;font-size:9px;letter-spacing:.16em}.footer b{color:#9deaff;font-weight:500}.active .core{animation:pulse 1.3s ease-in-out infinite}.active .r4{animation:pulseRing 1.3s ease-in-out infinite}.listening .status{color:#8dffda}.processing .status{color:#ffd88b}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);padding:10px 14px;background:#10283a;border:1px solid #48dfff66;border-radius:20px;color:#dffaff;font-size:11px;letter-spacing:.05em;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}.toast.show{opacity:1}@keyframes spin{to{transform:rotate(360deg)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{50%{box-shadow:0 0 30px #48dfff,0 0 80px #168bff9c,inset 0 0 24px #d9fbff88;transform:scale(1.06)}}@keyframes pulseRing{50%{box-shadow:0 0 34px #168bff55,inset 0 0 28px #168bff2c}}@keyframes wave{to{height:27px;opacity:1}}@media(min-width:600px){.app{padding-left:36px;padding-right:36px}.reactor-wrap{width:300px}}
</style></head>
<body><div class="app" id="app">
<header class="top"><div class="brand">J.A.R.V.I.S.<span> / CORE</span></div><div class="clock"><strong id="time">--:--</strong><span id="date">SISTEMA LOCAL</span></div></header>
<main class="main"><div class="eyebrow">PERSONAL AI INTERFACE</div>
<div class="reactor-wrap" id="reactor"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ticks"></div><div class="ring r4"></div><div class="core"></div><div class="orbit"></div></div>
<div class="status" id="status">SISTEMA EN ESPERA</div><div class="substatus" id="substatus">TODOS LOS SISTEMAS PREPARADOS</div>
<div class="visualizer" id="visualizer"></div>
<div class="controls"><button class="smallbtn" id="reset" aria-label="Volver a espera" title="Reiniciar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg></button><button class="mic" id="mic" aria-label="Activar micrófono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4m-4 0h8"/></svg></button><button class="smallbtn" id="speak" aria-label="Probar voz" title="Probar voz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 10v4h4l5 4V6l-5 4H4zM17 9a5 5 0 0 1 0 6M19 5a9 9 0 0 1 0 14"/></svg></button></div>
<div class="hint">TOCA EL NÚCLEO PARA HABLAR<br>O USA EL BOTÓN DE MICRÓFONO</div></main>
<footer class="footer"><span>VOICE MODULE <b id="voiceState">STANDBY</b></span><span>POWER <b id="battery">ONLINE</b></span><span>BUILD <b>01.00</b></span></footer></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id), app=$('app');let recognition=null,listening=false;
const bars=Array.from({length:31},()=>{let e=document.createElement('i');$('visualizer').appendChild(e);return e});
function clock(){let d=new Date();$('time').textContent=d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});$('date').textContent=d.toLocaleDateString('es-MX',{weekday:'short',day:'2-digit',month:'short'}).toUpperCase()}
clock();setInterval(clock,10000);
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
function state(s,sub,cls=''){app.className='app '+cls;$('status').textContent=s;$('substatus').textContent=sub}
function speak(text){if(!('speechSynthesis'in window)){toast('La síntesis de voz no está disponible en este navegador.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='es-MX';u.rate=.94;u.pitch=.88;u.onstart=()=>state('JARVIS HABLANDO','SALIDA DE AUDIO ACTIVA','active');u.onend=()=>state('SISTEMA EN ESPERA','TODOS LOS SISTEMAS PREPARADOS');speechSynthesis.speak(u)}
function start(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Este navegador no admite reconocimiento de voz. Prueba Chrome y permite el micrófono.');return}if(listening){recognition.stop();return}recognition=new SR();recognition.lang='es-MX';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onstart=()=>{listening=true;$('voiceState').textContent='LISTENING';state('ESCUCHANDO','HABLA AHORA · MICRÓFONO ACTIVO','active listening')};recognition.onresult=e=>{let t=e.results[0][0].transcript;state('VOZ DETECTADA','ENTRADA: '+t.toUpperCase(),'processing');toast('Reconocido: '+t);speak('He recibido tu mensaje: '+t+'. La conexión con mi módulo de inteligencia está pendiente de configuración.')};recognition.onerror=e=>{toast('Micrófono: '+e.error+'. Revisa los permisos del navegador.');state('SISTEMA EN ESPERA','MICRÓFONO NO DISPONIBLE')};recognition.onend=()=>{listening=false;$('voiceState').textContent='STANDBY';if(!$('status').textContent.includes('VOZ DETECTADA')&&!$('status').textContent.includes('JARVIS HABLANDO'))state('SISTEMA EN ESPERA','TODOS LOS SISTEMAS PREPARADOS')};try{recognition.start()}catch(e){toast('No se pudo iniciar el micrófono. Inténtalo de nuevo.')}}
$('mic').addEventListener('click',start);$('reactor').addEventListener('click',start);$('reset').addEventListener('click',()=>{if(recognition&&listening)recognition.stop();speechSynthesis?.cancel();state('SISTEMA EN ESPERA','TODOS LOS SISTEMAS PREPARADOS');$('voiceState').textContent='STANDBY'});$('speak').addEventListener('click',()=>speak('A tus órdenes. Todos los sistemas están preparados. ¿En qué puedo ayudarte?'));
if(!window.SpeechRecognition&&!window.webkitSpeechRecognition){$('voiceState').textContent='CHECK BROWSER'}
</script></body></html>
